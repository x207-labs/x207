# End-to-end tests of the whole product in near-sandbox (UM-025): real contract, facilitator, indexer, solver, keeper, marketplace book and broker.
# Five parallel jobs (matrix `shard`) run every file of `tests/*.test.ts` between them, split by scripts/e2e-shards.mjs so that each takes about the same time; each job writes its files and seconds to its summary. Among them are join and stake to claim with a default covered by stake (`e2e`),
# the barter ring (`barter`), the marketplace (`marketplace`) and the class B rental with revoke on default (`broker-class-b`).
#
# Needs one secret that already exists for the product CI: X207_CHECKOUT_TOKEN, read access to this repository and to the six product repositories
# that are submodules. Nothing is published or deployed, and no other secret is used.
name: E2E sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push waits for the run in progress instead of cancelling it (a run took about two hours, so a push now and then meant that no run ever finished).
  # GitHub keeps one waiting run per group: when several pushes arrive during one run, the newest of them runs next.
  group: e2e-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (shard ${{ matrix.shard }} of 5)
    runs-on: ubuntu-latest
    # A shard takes 28 to 31 minutes (run 5a7b58d: 28, 29 and 31 minutes for the three that finished); one shard hung for 54 minutes and held the queue, because a new push waits in the concurrency group. 45 leaves room for a slow runner.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # scripts/e2e-shards.mjs splits tests/*.test.ts by the seconds in scripts/lib/e2e-durations.json; `node scripts/e2e-shards.mjs --plan --of 4` shows the split.
        # Change the 5 here and in the places below together (UM-183: five shards of about 20 minutes; with four, shard 1 held security-review-contract3b, 19 minutes alone, and reached the 45 minute limit).
        shard: [1, 2, 3, 4, 5]
    env:
      # same settings as ci-rust.yml: test binaries with debug info filled the runner disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_NEAR_VERSION: "0.22.0"
      X207_SANDBOX: "1"
      # BE-066: the tests send far more requests than a person; no rate limit and no cap on open objects (body and page size stay on)
      API_LIMITS: "off"
      BROKER_LIMITS: "off"
    steps:
      - name: Require the checkout token
        env:
          TOKEN: ${{ secrets.X207_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret X207_CHECKOUT_TOKEN is missing: the submodules are private repositories."
            exit 1
          fi
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.X207_CHECKOUT_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build the TypeScript packages
        # dist of @x207/core, @x207/scheme, @x207/facilitator and the solver, which the tests load or run (solver/dist/cli.js). The frontend builds here too:
        # its test files are type-checked, and they need @testing-library/dom, which the frontend declares itself because npm does not install the peer in a workspace.
        run: npm run build --workspaces --if-present

      - name: Install the Rust toolchain of contracts
        working-directory: contracts
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-near
            ~/.cargo/registry
            ~/.cargo/git
          key: e2e-${{ runner.os }}-near0.22.0-${{ hashFiles('contracts/rust-toolchain.toml', 'contracts/Cargo.lock') }}
          restore-keys: |
            e2e-${{ runner.os }}-near0.22.0-
      - name: Install cargo-near
        run: |
          if ! cargo near --version 2>/dev/null | grep -qF "$CARGO_NEAR_VERSION"; then
            sudo apt-get update
            sudo apt-get install -y libudev-dev pkg-config
            cargo install cargo-near --version "$CARGO_NEAR_VERSION" --locked --force
          fi
      - name: Build the contract, the mock token, the mock NFT and the mock Intents
        working-directory: contracts
        run: |
          cargo near build non-reproducible-wasm
          cargo near build non-reproducible-wasm --manifest-path probes/mock_ft/Cargo.toml
          cargo near build non-reproducible-wasm --manifest-path probes/mock_nft/Cargo.toml
          # deployCircle({ mockIntents: true }) of the sandbox tests (security reviews 3 and 3b) and tests/security-review-sdk.test.ts read this file
          cargo near build non-reproducible-wasm --manifest-path probes/mock_intents/Cargo.toml
          ls -l target/near/x207_circle.wasm target/near/mock_ft/mock_ft.wasm target/near/mock_nft/mock_nft.wasm target/near/mock_intents/mock_intents.wasm
      - name: Get the near-sandbox binary
        # The sandbox harness looks for it in target/debug/build/near-sandbox-*/out/.near, where the build script of near-workspaces puts it.
        # Building the unit tests of the lib compiles the dev-dependencies, so the script runs; if the binary is still missing, build all test binaries.
        working-directory: contracts
        run: |
          found() { find target/debug/build -path '*near-sandbox-*/out/.near/*/near-sandbox' -type f 2>/dev/null | grep . ; }
          cargo test --locked --lib --no-run
          found || { cargo test --locked --no-run; found; } || { echo "::error::near-sandbox binary not found"; exit 1; }

      - name: The shards cover every test file once, among them the barter ring and the class B rental
        # The shards come from one deterministic split, so the five jobs together hold every file exactly once; the unit test of the split checks e2e, barter, marketplace and broker-class-b.
        run: |
          node --test scripts/e2e-shards.test.mjs scripts/e2e-summary.test.mjs
          npx vitest list --filesOnly | sed "s|^$PWD/||" | sort > /tmp/listed.txt
          for n in 1 2 3 4 5; do node scripts/e2e-shards.mjs --shard "$n" --of 5; done | sort > /tmp/sharded.txt
          diff /tmp/listed.txt /tmp/sharded.txt || { echo "::error::the shards do not hold exactly the files that vitest lists"; exit 1; }
      - name: End-to-end tests in near-sandbox (shard ${{ matrix.shard }} of 5)
        # One file at a time: the sandbox tests move block time and compete for the CPU otherwise.
        run: |
          mapfile -t FILES < <(node scripts/e2e-shards.mjs --shard "${{ matrix.shard }}" --of 5)
          echo "shard ${{ matrix.shard }}: ${#FILES[@]} files"
          X207_SANDBOX=1 npx vitest run --no-file-parallelism --reporter=default --reporter=json --outputFile.json=/tmp/e2e-report.json "${FILES[@]}"
      - name: Summary of the shard (test files and their seconds)
        if: always()
        run: |
          if [ -f /tmp/e2e-report.json ]; then
            node scripts/e2e-summary.mjs /tmp/e2e-report.json "E2E sandbox, shard ${{ matrix.shard }} of 5" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No vitest report: the run stopped before the tests wrote one." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Disk after the run
        if: always()
        run: df -h /
