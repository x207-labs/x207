name: Monitor boxd machine

# UM-151: every 15 minutes check the read API, the hosted MCP and the keeper heartbeat (scripts/monitor-check.mjs).
# UM-172: it also reads the indexer lag of the v013, v014 and v015 APIs; a lag that does not shrink names the neardata cache (x207-neardata-cache) in the issue.
# A failure opens one issue labelled "monitor", assigned to and mentioning the owner so GitHub notifies them (or adds a comment to the open one); the next green run closes it.
# UM-157: "Run workflow" with api_url set to a wrong address is the test of the failure path.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Test only: read API URL to check instead of the real one (a wrong URL makes the run fail, to prove the issue and the notification)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run checks
        id: check
        env:
          MONITOR_API_URL: ${{ github.event.inputs.api_url }}
        run: |
          set +e
          node scripts/monitor-check.mjs | tee monitor.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue on failure
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: Shenhan01-sys
        run: |
          body="$(printf '@%s the monitor of the boxd machine found a problem.\nMonitor run: %s/%s/actions/runs/%s\n\n```\n%s\n```\n\nSee docs/keeper-operations.md (Monitoring, Backup and restore).' "$OWNER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat monitor.log)")"
          gh label create monitor --color B60205 --description "boxd machine monitor" 2>/dev/null || true
          number="$(gh issue list --label monitor --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "boxd machine x207: a monitor check failed" --label monitor --assignee "$OWNER" --body "$body"
          fi
      - name: Close the open issue when all checks pass
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label monitor --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "All checks pass again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
      - name: Fail the run when a check failed
        if: steps.check.outputs.code != '0'
        run: exit 1
