# Reusable CI for the `contracts` repository. Usage:
#
#   name: CI
#   on: { push: { branches: [main] }, pull_request: {} }
#   permissions: { contents: read }
#   jobs:
#     ci:
#       uses: x207-labs/x207/.github/workflows/ci-rust.yml@<pinned-ref>
#
# The Rust version and the wasm target come from the caller's rust-toolchain.toml (K-57).
name: CI Rust

on:
  workflow_call:
    inputs:
      cargo-near-version:
        description: cargo-near version (ADR-11).
        type: string
        default: "0.22.0"
      working-directory:
        description: Folder that holds Cargo.toml and rust-toolchain.toml.
        type: string
        default: "."
      intents-wasm:
        description: Fetch the wasm of intents.near from mainnet (RPC view_code, read only, sha256 checked, scripts/fetch-intents-wasm.sh) and make the test ct103_real_intents fail when it is missing (CT-103).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The sandbox tests run one at a time (see Test below) and take about an hour on their own.
    timeout-minutes: 150
    env:
      # 37 test binaries with debug info filled the runner disk (`ld terminated with signal 7 [Bus error]`).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Free disk space
        # Removes toolchains this job does not use; a hosted runner has about 14 GB free otherwise.
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-near
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-near${{ inputs.cargo-near-version }}-${{ hashFiles(format('{0}/rust-toolchain.toml', inputs.working-directory), format('{0}/Cargo.lock', inputs.working-directory)) }}
          restore-keys: |
            rust-${{ runner.os }}-near${{ inputs.cargo-near-version }}-
      - name: Install cargo-near
        env:
          CARGO_NEAR_VERSION: ${{ inputs.cargo-near-version }}
        run: |
          if ! cargo near --version 2>/dev/null | grep -qF "$CARGO_NEAR_VERSION"; then
            sudo apt-get update
            sudo apt-get install -y libudev-dev pkg-config
            cargo install cargo-near --version "$CARGO_NEAR_VERSION" --locked --force
          fi
      - name: Build contract
        run: cargo near build non-reproducible-wasm
      - name: Fetch the wasm of intents.near
        if: ${{ inputs.intents-wasm }}
        run: scripts/fetch-intents-wasm.sh
      - name: Test
        # One test at a time: the sandbox tests move block time and fail with ERR_PAST_CUTOFF when they compete for the CPU.
        env:
          X207_REQUIRE_INTENTS_WASM: ${{ inputs.intents-wasm && '1' || '' }}
        run: cargo test --locked -- --test-threads=1
      - name: Disk after the build
        if: always()
        run: df -h / && du -sh target
